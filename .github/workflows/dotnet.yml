name: .NET
on:
  push:
    branches: [ "main", "feature/structured-web-api-example" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/EventsAssistant.Api/EventsAssistant.Api.csproj
      - run: dotnet build src/EventsAssistant.Api/EventsAssistant.Api.csproj --no-restore
